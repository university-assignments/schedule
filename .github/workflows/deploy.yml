name: Deploy

# Три повода собрать страницу: ручной пуш, кнопка в интерфейсе и вызов из fetch.yml.
#
# workflow_call здесь не для красоты. Коммит, сделанный самим Actions через GITHUB_TOKEN,
# намеренно НЕ порождает событие push — иначе рабочие процессы зацикливались бы. Значит
# выгрузка расписания сама по себе ничего бы не опубликовала, и свежие данные лежали бы
# в репозитории, не попадая на сайт. Поэтому fetch.yml вызывает эту сборку напрямую.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации отменять нельзя: прерванная на середине оставляет Pages
# в промежуточном состоянии. Ждём очереди.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Полная сборка вместе с проверкой типов: отсюда публикуется то, что увидят люди,
      # и ронять её молча из-за сломанного типа нельзя.
      - run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
