name: Deploy

# Два повода собрать страницу: пуш в main и кнопка в интерфейсе. Свежее расписание
# приезжает тем же пушем — выгрузка запускается вручную, см. README.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации отменять нельзя: прерванная на середине оставляет Pages
# в промежуточном состоянии. Ждём очереди.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Полная сборка вместе с проверкой типов: отсюда публикуется то, что увидят люди,
      # и ронять её молча из-за сломанного типа нельзя.
      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
